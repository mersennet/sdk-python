[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mersennet-sdk"
dynamic = ["version"]
description = "Python SDK for Mersennet: JSON-RPC, the on-chain order book (MersennetOrders precompile), shielded notes and viewing keys"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mersennet Foundation", email = "dev@mersennet.com" }]
keywords = ["mersennet", "blockchain", "evm", "order-book", "perpetuals", "zk", "json-rpc", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
    "websocket-client>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://mersennet.com"
Documentation = "https://docs.mersennet.com/developers/sdks/python/"
Repository = "https://github.com/mersennet/sdk-python"
Issues = "https://github.com/mersennet/sdk-python/issues"

[tool.setuptools.dynamic]
version = { attr = "mersennet.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["mersennet*"]
