version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    labels: [dependencies]
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
