name: Publish to PyPI
# Runs on every GitHub release. Uploads via PyPI trusted publishing (no token)
# once the repository variable PYPI_TRUSTED is set to "1" — i.e. after the
# "mersennet-sdk" project on PyPI has this repo/workflow registered as a publisher.
on:
  release: { types: [published] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - name: Version must match the tag
        if: github.event_name == 'release'
        run: test "v$(python -c "import mersennet; print(mersennet.__version__)")" = "${{ github.event.release.tag_name }}"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  pypi:
    needs: build
    if: vars.PYPI_TRUSTED == '1'
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
